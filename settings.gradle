rootProject.name = 'GuineaPal-New'

// Disable transforms globally
gradle.beforeProject { project ->
    project.extensions.extraProperties.set('android.enableTransforms', false)
    project.extensions.extraProperties.set('android.enableBuildCache', false)
    project.extensions.extraProperties.set('android.enableParallelExecution', false)
}

// Disable build cache
gradle.startParameter.buildCacheEnabled = false
gradle.startParameter.parallelProjectExecutionEnabled = false
gradle.startParameter.configureOnDemand = false

// Configure Gradle properties
gradle.projectsEvaluated {
    gradle.startParameter.parallelProjectExecutionEnabled = false
    gradle.startParameter.buildCacheEnabled = false
    gradle.startParameter.configureOnDemand = false
}

// Disable transform metadata
gradle.taskGraph.beforeTask { task ->
    if (task.name.contains('transform')) {
        task.doFirst {
            def transformDir = new File("${gradle.gradleUserHomeDir}/caches/${gradle.gradleVersion}/transforms")
            if (transformDir.exists()) {
                transformDir.eachDir { dir ->
                    if (dir.name.contains('metadata')) {
                        dir.deleteDir()
                    }
                }
            }
        }
    }
}

// Configure transform metadata handling
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        if (task.name.contains('transform')) {
            task.doFirst {
                def transformDir = new File("${gradle.gradleUserHomeDir}/caches/${gradle.gradleVersion}/transforms")
                if (transformDir.exists()) {
                    transformDir.eachDir { dir ->
                        if (dir.name.contains('metadata')) {
                            dir.deleteDir()
                        }
                    }
                }
            }
        }
    }
}

// Configure transform metadata handling for all projects
